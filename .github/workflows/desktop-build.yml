name: desktop-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA (embarquée dans l'image)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller pywebview

      - name: Build Proprietas.exe
        run: pyinstaller --clean --noconfirm desktop/proprietas.spec

      - name: Smoke test (server responds)
        shell: pwsh
        run: |
          $env:PROPRIETAS_NO_WINDOW = '1'
          $p = Start-Process -FilePath dist\Proprietas\Proprietas.exe -PassThru
          $line = ''
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "launcher exited early, code $($p.ExitCode)"; break }
            if (Test-Path dist\Proprietas\url.txt) {
              $line = (Get-Content dist\Proprietas\url.txt -First 1).Trim()
              if ($line) { break }
            }
          }
          if (Test-Path dist\Proprietas\error.log) { Write-Host '--- error.log ---'; Get-Content dist\Proprietas\error.log }
          Write-Host "launcher url: $line"
          if (-not $line -or -not $line.StartsWith('http://127.0.0.1:')) { throw "launcher did not start" }
          $base = $line.TrimEnd('/')
          $h = (Invoke-WebRequest -Uri "$base/api/health" -UseBasicParsing -TimeoutSec 15).Content
          Write-Host "health response: $h"
          if ($h -notmatch 'Proprietas') { throw "API health not from Proprietas" }
          $ui = (Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 15).Content
          if ($ui -notmatch 'Proprietas') { throw "UI not served from bundle" }
          if (-not (Test-Path dist\Proprietas\data\proprietas.db)) { throw "database not created" }
          Write-Host "UI check: Proprietas found in bundle HTML; SQLite database created"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Window smoke test (real window + screenshot)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $env:PROPRIETAS_NO_WINDOW = $null
          $p = Start-Process -FilePath dist\Proprietas\Proprietas.exe -PassThru
          Start-Sleep -Seconds 40
          $all = Get-Process -Name Proprietas -ErrorAction SilentlyContinue
          if (-not $all) {
            Write-Host 'window mode: process exited'
            if (Test-Path dist\Proprietas\error.log) { Write-Host '--- error.log ---'; Get-Content dist\Proprietas\error.log }
            throw 'window mode: process died before showing a window'
          }
          $all | Select-Object Id, MainWindowTitle, MainWindowHandle, StartTime | Format-List | Out-String | Write-Host
          $main = $all | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
          Write-Host "MainWindowTitle=[$($main.MainWindowTitle)]"
          Write-Host "browser fallback? msedge processes: $((Get-Process msedge -ErrorAction SilentlyContinue).Count)"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $b = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($b)
          $g.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $b.Size)
          $b.Save("$PWD\shots\window.png")
          $g.Dispose(); $b.Dispose()
          if (-not $main) {
            if (Test-Path dist\Proprietas\error.log) { Get-Content dist\Proprietas\error.log }
            throw 'no visible window handle'
          }
          Start-Sleep -Seconds 2
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Get-Process -Name Proprietas -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProprietasDesktop-shot
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Debug files (always)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path debug | Out-Null
          Copy-Item dist\Proprietas\url.txt debug\ -ErrorAction SilentlyContinue
          Copy-Item dist\Proprietas\error.log debug\ -ErrorAction SilentlyContinue
          Get-ChildItem debug -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProprietasDesktop-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        shell: pwsh
        run: |
          Remove-Item dist\Proprietas\url.txt -ErrorAction SilentlyContinue
          Remove-Item dist\Proprietas\error.log -ErrorAction SilentlyContinue
          Remove-Item dist\Proprietas\desktop.log -ErrorAction SilentlyContinue
          Remove-Item dist\Proprietas\data -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item desktop\LISEZ-MOI.txt dist\Proprietas\
          Copy-Item desktop\README.txt dist\Proprietas\
          Copy-Item desktop\LIESMICH.txt dist\Proprietas\
          Copy-Item desktop\LIES-MICH.txt dist\Proprietas\
          Compress-Archive -Path dist\Proprietas -DestinationPath Proprietas-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProprietasDesktop-windows
          path: Proprietas-Windows.zip
          retention-days: 30

  macos:
    runs-on: macos-latest      # arm64 (Apple Silicon)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA (embarquée dans l'app)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller pywebview

      - name: Build Proprietas.app
        run: pyinstaller --clean --noconfirm desktop/proprietas.spec

      - name: Ad-hoc signing (required on Apple Silicon)
        run: |
          codesign --force --deep --sign - --timestamp=none dist/Proprietas.app
          codesign -dv dist/Proprietas.app 2>&1 | grep -i signature

      - name: "Smoke test (headless: server + API + UI + SQLite database)"
        env:
          PROPRIETAS_NO_WINDOW: '1'
        run: |
          ./dist/Proprietas.app/Contents/MacOS/Proprietas &
          PID=$!
          for i in $(seq 1 60); do
            sleep 2
            [ -s dist/url.txt ] && break
          done
          if [ -f dist/error.log ]; then echo '--- error.log ---'; cat dist/error.log; fi
          LINE="$(head -n 1 dist/url.txt 2>/dev/null || true)"
          echo "launcher url: $LINE"
          case "$LINE" in http://127.0.0.1:*) ;; *) echo "launcher did not start"; kill $PID 2>/dev/null || true; exit 1;; esac
          BASE="${LINE%/}"
          curl -fsS "$BASE/api/health"; echo
          curl -fsS "$BASE/api/health" | grep -q Proprietas
          curl -fsS "$BASE/" | grep -q Proprietas
          test -f dist/data/proprietas.db
          echo "UI check: Proprietas found in bundle HTML; SQLite database created"
          kill $PID 2>/dev/null || true

      - name: "Window smoke test (best effort: real window)"
        continue-on-error: true
        run: |
          rm -f dist/url.txt
          open dist/Proprietas.app
          sleep 25
          LINE="$(head -n 1 dist/url.txt 2>/dev/null || true)"
          echo "windowed url: $LINE"
          if [ -n "$LINE" ]; then curl -fsS "${LINE%/}/api/health"; echo; fi
          pgrep -fl 'Proprietas.app/Contents/MacOS' || echo 'process not found'
          pkill -f '[P]roprietas.app/Contents/MacOS' || true

      - name: Debug files (always)
        if: always()
        run: |
          mkdir -p debug
          cp dist/url.txt debug/ 2>/dev/null || true
          cp dist/error.log debug/ 2>/dev/null || true
          cp dist/desktop.log debug/ 2>/dev/null || true
          ls -la debug/ || true

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProprietasDesktop-macos-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: "Package (zip with user guides in 4 languages)"
        run: |
          rm -rf "Proprietas-macOS"
          mkdir -p "Proprietas-macOS"
          ditto dist/Proprietas.app "Proprietas-macOS/Proprietas.app"
          cp desktop/macos/LISEZ-MOI.txt desktop/macos/README.txt desktop/macos/LIESMICH.txt desktop/macos/LIES-MICH.txt "Proprietas-macOS/"
          rm -f "Proprietas-macOS/url.txt" "Proprietas-macOS/desktop.log" "Proprietas-macOS/error.log"
          ditto -c -k --sequesterRsrc --keepParent "Proprietas-macOS" "Proprietas-macOS.zip"
          unzip -l "Proprietas-macOS.zip" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProprietasDesktop-macos
          path: Proprietas-macOS.zip
          retention-days: 30
