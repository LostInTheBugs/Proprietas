name: Release
on:
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]"
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]-c*"
  # Construire à la main l'image d'un tag déjà publié (ex. 2026.10.003, antérieur à ce job).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant (AAAA.MM.NNN)"
        required: true
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extraire les notes du CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            # Notes de la version, puis des 10 précédentes : seule la dernière release est gardée sur
            # GitHub (job « nettoyage »), un serveur en retard doit pourtant voir ce qui a changé.
            awk -v t="$TAG" -v max=11 '
              !f && index($0, t) && /^#/ {f=1; n=1; print; next}
              /^#+ *\[?20[0-9][0-9]\./ {if (f) {n++; if (n > max) exit; if (n == 2) print "\n---\nVersions précédentes :\n"}}
              f {print}' CHANGELOG.md > /tmp/notes.md
          fi
          [ -s /tmp/notes.md ] || echo "Release $TAG" > /tmp/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: true

  # Image Docker du backend (frontend compris) publiée sur GHCR : les serveurs en stratégie
  # « pull » (petits VPS) la téléchargent au lieu de la construire (npm build = 1 à 2 Go de RAM).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Vérifier le format du tag
        run: echo "$TAG" | grep -Eq '^20[0-9]{2}\.[0-9]{2}\.[0-9]{3}(-c[0-9]+)?$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: La version du code correspond au tag
        run: test "$(cat VERSION)" = "$TAG"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lostinthebugs/proprietas:${{ env.TAG }}
            ghcr.io/lostinthebugs/proprietas:latest
          labels: |
            org.opencontainers.image.source=https://github.com/LostInTheBugs/Proprietas
            org.opencontainers.image.version=${{ env.TAG }}

  # Ne garder sur GitHub que la dernière release et la dernière image (les tags git restent).
  # Après la publication de l'image : un serveur qui met à jour trouve toujours son image.
  nettoyage:
    if: github.event_name == 'push'
    needs: [release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Supprimer les anciennes releases et images
        run: scripts/nettoyer-github.sh "${GITHUB_REF_NAME}"
