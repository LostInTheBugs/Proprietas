name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        # python -m pytest : garantit que le répertoire courant est dans sys.path
        # (les tests importent `tests.conftest`).
        run: python -m pytest -q

  securite:
    name: Sécurité (ruff, pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outils
        run: pip install ruff pip-audit
      - name: ruff (erreurs graves seulement : syntaxe, noms indéfinis)
        run: ruff check --select E9,F63,F7,F82 backend deploy
      - name: pip-audit (failles connues des dépendances Python)
        run: pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (failles élevées ou critiques des dépendances livrées)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # monorepo : le lock vit dans frontend/, pas à la racine du workspace
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (inclut tsc -b, donc le typecheck)
        run: npm run build
