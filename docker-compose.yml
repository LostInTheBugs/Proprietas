services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: copro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: copro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copro"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Image publiée par GitHub à chaque release (workflow release.yml, job « image ») ;
    # `build` reste disponible pour les serveurs qui construisent sur place.
    # PROPRIETAS_VERSION (dans .env) : tag de l'image — écrit par deploy/apply-update.py
    # en stratégie « pull ».
    image: ghcr.io/lostinthebugs/proprietas:${PROPRIETAS_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Réglages COPRO_* du .env (pool PostgreSQL, stockage S3, plafonds, journal, 2FA par défaut…) :
    # transmis à l'application. Les variables de `environment` ci-dessous gardent la priorité.
    env_file:
      - path: .env
        required: false
    environment:
      COPRO_DATABASE_URL: postgresql+psycopg2://copro:${POSTGRES_PASSWORD}@db:5432/copro
      COPRO_SECRET_KEY: ${COPRO_SECRET_KEY}
      COPRO_UPLOAD_DIR: /data/uploads
      COPRO_FRONTEND_DIST: /app/frontend_dist
      COPRO_UPDATE_DIR: /data/updates
      # Heure des dates affichées (noms des sauvegardes, journal, e-mails) : sans fuseau, le conteneur est en
      # UTC, une heure de moins qu'à Paris l'hiver. Autre fuseau : TZ=… dans le .env.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - uploads:/data/uploads
      # Dossier partagé avec l'applicateur de mises à jour de l'hôte (deploy/apply-update.py)
      - ./data/updates:/data/updates
    # (le bundle frontend est dans l'image multi-stage — plus de volume frontend_dist)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    # Profil « internet » : expose l'application derrière un proxy TLS à certificats
    # Let's Encrypt automatiques. L'activer :
    #   COPRO_DOMAIN="copro.exemple.fr" docker compose --profile internet up -d --build
    # (sans ce profil, seuls db + backend tournent — accès réseau local uniquement)
    profiles: ["internet"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COPRO_DOMAIN: ${COPRO_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # ---------- Serveur Jitsi (réunions en ligne), en option ----------
  # Profil « jitsi », éteint par défaut : sans lui, les salles sont créées sur meet.jit.si (ou sur le
  # serveur saisi dans Réglages → Réunion en ligne). Mode d'emploi : docs/jitsi.md. L'activer :
  #   JITSI_PUBLIC_URL=https://visio.exemple.fr JICOFO_AUTH_PASSWORD=… JVB_AUTH_PASSWORD=… \
  #   docker compose --profile jitsi up -d
  # Images officielles (github.com/jitsi/docker-jitsi-meet) ; JITSI_IMAGE_VERSION pour figer une version.
  jitsi-web:
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable}
    profiles: ["jitsi"]
    restart: unless-stopped
    ports:
      - "${JITSI_HTTP_PORT:-8080}:80"
      - "${JITSI_HTTPS_PORT:-8443}:443"
    environment:
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-}
      TZ: ${TZ:-Europe/Paris}
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      ENABLE_LETSENCRYPT: "0"
    volumes:
      - jitsi_web:/config
    networks:
      meet.jitsi:
      default:          # joignable par Caddy (profil « internet ») : voir docs/jitsi.md
    depends_on:
      - jitsi-jvb

  jitsi-prosody:
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable}
    profiles: ["jitsi"]
    restart: unless-stopped
    expose:
      - "5222"
      - "5280"
      - "5347"
    environment:
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-}
      TZ: ${TZ:-Europe/Paris}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:-}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:-}
    volumes:
      - jitsi_prosody_config:/config
      - jitsi_prosody_plugins:/prosody-plugins-custom
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi

  jitsi-jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable}
    profiles: ["jitsi"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:-}
      XMPP_SERVER: xmpp.meet.jitsi
    volumes:
      - jitsi_jicofo:/config
    networks:
      meet.jitsi:
    depends_on:
      - jitsi-prosody

  jitsi-jvb:
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable}
    profiles: ["jitsi"]
    restart: unless-stopped
    ports:
      # Audio et vidéo : ce port UDP doit être ouvert (et redirigé par la box) vers ce serveur.
      - "${JITSI_JVB_PORT:-10000}:${JITSI_JVB_PORT:-10000}/udp"
    environment:
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-}
      TZ: ${TZ:-Europe/Paris}
      JVB_PORT: ${JITSI_JVB_PORT:-10000}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:-}
      JVB_ADVERTISE_IPS: ${JITSI_ADVERTISE_IPS:-}
      XMPP_SERVER: xmpp.meet.jitsi
    volumes:
      - jitsi_jvb:/config
    networks:
      meet.jitsi:
    depends_on:
      - jitsi-prosody

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  jitsi_web:
  jitsi_prosody_config:
  jitsi_prosody_plugins:
  jitsi_jicofo:
  jitsi_jvb:

networks:
  # Réseau des conteneurs Jitsi (profil « jitsi ») ; les autres services restent sur le réseau par défaut.
  meet.jitsi:
