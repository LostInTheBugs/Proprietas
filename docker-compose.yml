services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: copro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: copro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copro"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      COPRO_DATABASE_URL: postgresql+psycopg2://copro:${POSTGRES_PASSWORD}@db:5432/copro
      COPRO_SECRET_KEY: ${COPRO_SECRET_KEY}
      COPRO_UPLOAD_DIR: /data/uploads
      COPRO_FRONTEND_DIST: /app/frontend_dist
    volumes:
      - uploads:/data/uploads
    # (le bundle frontend est dans l'image multi-stage — plus de volume frontend_dist)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    # Profil « internet » : expose l'application derrière un proxy TLS à certificats
    # Let's Encrypt automatiques. L'activer :
    #   COPRO_DOMAIN="copro.exemple.fr" docker compose --profile internet up -d --build
    # (sans ce profil, seuls db + backend tournent — accès réseau local uniquement)
    profiles: ["internet"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COPRO_DOMAIN: ${COPRO_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
